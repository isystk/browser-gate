# ローカル用。api / login は同一イメージで、MODE 環境変数だけが異なる
x-browser-gate: &browser-gate
  build: .
  image: browser-gate:local
  init: true
  shm_size: 1gb
  restart: unless-stopped

services:
  api:
    <<: *browser-gate
    container_name: browser-gate-api
    environment:
      MODE: api
      CONFIG_PATH: /app/config/local.json
      EGRESS_PREFER_IPV4: ${EGRESS_PREFER_IPV4:-}
      # ログイン済みプロファイルの読み取り用（login が保存したものを読み取り専用で参照する）
      PROFILE_ENCRYPTION_KEY: ${PROFILE_ENCRYPTION_KEY:-}
      PROFILE_STORE_DIR: /data/profiles
    volumes:
      - ./config:/app/config:ro
      - login-profiles:/data/profiles:ro
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"

  login:
    <<: *browser-gate
    container_name: browser-gate-login
    environment:
      MODE: login
      CONFIG_PATH: /app/config/local.json
      EGRESS_PREFER_IPV4: ${EGRESS_PREFER_IPV4:-}
      PUBLIC_BASE_URL: http://localhost:${LOGIN_HOST_PORT:-8081}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      PROFILE_ENCRYPTION_KEY: ${PROFILE_ENCRYPTION_KEY:-}
      # 実際の Google OAuth を試すときは OAUTH_FAKE を空にして OAUTH_CLIENT_JSON を設定する
      OAUTH_FAKE: ${OAUTH_FAKE:-}
      OAUTH_CLIENT_JSON: ${OAUTH_CLIENT_JSON:-}
      PROFILE_STORE_DIR: /data/profiles
      # 切断後の自動破棄までの猶予（秒）。空なら既定の 180 秒
      LOGIN_DISCONNECT_GRACE_SECONDS: ${LOGIN_DISCONNECT_GRACE_SECONDS:-}
      # ログイン用ブラウザの方式。plain で Playwright/CDP なしの素の Chromium、空なら従来方式（playwright）
      LOGIN_BROWSER_MODE: ${LOGIN_BROWSER_MODE:-}
    volumes:
      - ./config:/app/config:ro
      - login-profiles:/data/profiles
    # noVNC（websockify）はコンテナ内の 127.0.0.1 のみ。ホストへ公開するのは OAuth 認証付きの 8080 だけ
    ports:
      - "127.0.0.1:${LOGIN_HOST_PORT:-8081}:8080"

  # 設定ファイルの管理CLI用（make keys-* から実行。通常の up では起動しない）
  keys:
    <<: *browser-gate
    profiles:
      - tools
    restart: "no"
    environment:
      CONFIG_PATH: /app/config/local.json
    volumes:
      - ./config:/app/config
    entrypoint:
      - npm
      - run
      - --silent
      - keys
      - --

  # Terraform 実行用（make infra-* から実行。通常の up では起動しない）。
  # ホストの ADC（gcloud auth application-default login）を読み取り専用でマウントする。
  terraform:
    image: hashicorp/terraform:1.13
    profiles:
      - tools
    working_dir: /infra
    entrypoint:
      - terraform
    environment:
      HOME: /tmp
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/application_default_credentials.json
    volumes:
      - ./infra:/infra
      - ${HOME}/.config/gcloud/application_default_credentials.json:/gcloud/application_default_credentials.json:ro

volumes:
  # ローカルの暗号化済みプロファイル置き場（削除しない）
  login-profiles:
