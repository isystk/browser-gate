# ローカル用。api / login は同一イメージで、MODE 環境変数だけが異なる
x-browser-gate: &browser-gate
  build: .
  image: browser-gate:local
  init: true
  shm_size: 1gb
  restart: unless-stopped

services:
  api:
    <<: *browser-gate
    container_name: browser-gate-api
    environment:
      MODE: api
      CONFIG_PATH: /app/config/local.json
    volumes:
      - ./config:/app/config:ro
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"

  login:
    <<: *browser-gate
    container_name: browser-gate-login
    environment:
      MODE: login
      NOVNC_LISTEN: 0.0.0.0
    ports:
      - "127.0.0.1:${LOGIN_HOST_PORT:-8081}:8080"
      - "127.0.0.1:${NOVNC_HOST_PORT:-6080}:6080"

  # 設定ファイルの管理CLI用（make keys-* から実行。通常の up では起動しない）
  keys:
    <<: *browser-gate
    profiles:
      - tools
    restart: "no"
    environment:
      CONFIG_PATH: /app/config/local.json
    volumes:
      - ./config:/app/config
    entrypoint:
      - npm
      - run
      - --silent
      - keys
      - --
