name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare .env and config
        run: make init

      - name: Lint (ESLint + Prettier)
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Test (unit + integration)
        run: make test
